<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HVAC Tool & Parts Checklist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header>
      <h1>HVAC Tool & Parts Checklist</h1>
    </header>

    <main>
      <section id="add-item-section">
        <input type="text" id="item-input" placeholder="Enter tool or part">
        <button id="add-item-btn">Add Item</button>
      </section>

      <section id="checklist-section">
        <p id="checklist-status"></p>
        <ul id="checklist"></ul>
        <button id="clear-list-btn">Clear List</button>
      </section>
    </main>

    <footer>
      <p>Built for HVAC techs, one job site at a time.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
